# Thunderstore CLI config. Used by `tcli publish`.
# Install tcli once: dotnet tool install --global tcli
# Publish: pwsh ./scripts/publish.ps1   (or)   tcli publish --file dist/<author>-<mod>-<version>.zip

[config]
schemaVersion = "0.0.1"

[package]
namespace      = "PrimeStrat"
name           = "BingBongVoiceOverride"
versionNumber  = "1.0.6"
description    = "Drop custom audio files into the sounds folder to override Bing Bong's SFX in PEAK."
websiteUrl     = "https://github.com/PrimeStrat/peak-bingbong-voice-override"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_PEAK = "5.4.75301"

[build]
icon       = "thunderstore/icon.png"
readme     = "thunderstore/README.md"
outdir     = "dist"

[[build.copy]]
source = "build/package/Mods"
target = "Mods"

[[build.copy]]
source = "thunderstore/CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
# The community/game slug on Thunderstore for PEAK.
repository = "https://thunderstore.io"
communities = ["peak"]

[publish.categories]
peak = ["audio", "mods"]
